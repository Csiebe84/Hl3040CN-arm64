name: rust-kernels

# Builds the Rust acceleration kernels and runs the whole test suite against
# them.  The plain `tests` workflow runs everything in pure Python, so it can
# stay green while a kernel does not even compile -- this job is the one that
# proves the native path.  It is also the only place a kernel is built: the
# Odroid is not allowed to compile (AGENTS.md, Regel Nr. 1).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hl3040cn/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hl3040cn/rust/Cargo.toml') }}

      - name: Install dependencies
        run: pip install --quiet numpy

      - name: Install Ghostscript
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript

      # cargo, not maturin: the wheel layout is not what the driver loads.  The
      # driver imports the kernels from `src/` next to the Python modules, so the
      # cdylib is copied there as a plain `_hl3040cn_native.so`.
      - name: Build the Rust extension
        working-directory: hl3040cn/rust
        run: cargo build --release

      - name: Stage the native module and the shims
        run: |
          cp hl3040cn/rust/target/release/lib_hl3040cn_native.so hl3040cn/src/_hl3040cn_native.so
          cp hl3040cn/rust/shims/_*_fast.py hl3040cn/src/
          ls -l hl3040cn/src/_hl3040cn_native.so

      - name: Prove the kernels are the native ones
        working-directory: hl3040cn/src
        run: |
          python3 - <<'PY'
          import _hl3040cn_native, _rle_fast, _fine_fast, _band_fast, _color_fast, _dither_fast
          assert _hl3040cn_native.__file__.endswith(".so"), _hl3040cn_native.__file__
          print("native module:", _hl3040cn_native.__file__)
          for mod in (_rle_fast, _fine_fast, _band_fast, _color_fast, _dither_fast):
              print("shim ok:", mod.__name__, "->", mod.__file__)
          PY

      - name: Kernel parity (signature guard + golden corpus)
        working-directory: hl3040cn/src
        run: |
          python3 -m unittest test_kernel_signature -v
          python3 -m unittest test_fine_fast_equiv -v

      - name: Full suite against the native kernels
        working-directory: hl3040cn/src
        run: python3 -m unittest discover -p "test_*.py" -v

      - name: Kernel benchmark
        run: python3 tools/bench_kernels.py

      - name: clippy
        if: always()
        working-directory: hl3040cn/rust
        run: cargo clippy --release --all-targets
