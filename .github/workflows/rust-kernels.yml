name: rust-kernels

# Builds the Rust acceleration kernels and runs the whole test suite against
# them.  The plain `tests` workflow runs everything in pure Python, so it can
# stay green while a kernel does not even compile -- this job is the one that
# proves the native path.  It is also the only place a kernel is built: the
# Odroid is not allowed to compile (AGENTS.md, Regel Nr. 1).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hl3040cn/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hl3040cn/rust/Cargo.toml') }}

      - name: Install dependencies
        run: pip install --quiet numpy maturin

      - name: Install Ghostscript
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript

      # maturin builds the cdylib and drops it in the source tree as
      # `_hl3040cn_native`, next to the Python modules.
      - name: Build the Rust extension
        working-directory: hl3040cn/rust
        run: maturin build --release --out /tmp/wheels

      - name: Install the wheel
        run: pip install --force-reinstall --no-deps /tmp/wheels/*.whl

      # The shims carry the old module names; install them next to the sources
      # so `import _rle_fast` resolves to the Rust implementation.
      - name: Install the module shims
        run: cp hl3040cn/rust/shims/_*_fast.py hl3040cn/src/

      - name: Prove the kernels are the native ones
        working-directory: hl3040cn/src
        run: |
          python3 - <<'PY'
          import _hl3040cn_native, _rle_fast, _fine_fast, _band_fast, _color_fast, _dither_fast
          import _hl3040cn_native as n
          print("native module file:", n.__file__)
          assert n.__file__.endswith((".so", ".pyd")), n.__file__
          for mod in (_rle_fast, _fine_fast, _band_fast, _color_fast, _dither_fast):
              print("shim ok:", mod.__name__, "->", mod.__file__)
          PY

      - name: Kernel parity (golden corpus + signature)
        working-directory: hl3040cn/src
        run: |
          python3 -m unittest test_kernel_signature -v
          python3 -m unittest test_fine_fast_equiv -v

      - name: Full suite against the native kernels
        working-directory: hl3040cn/src
        run: python3 -m unittest discover -p "test_*.py" -v

      - name: clippy
        if: always()
        working-directory: hl3040cn/rust
        run: cargo clippy --release --all-targets
